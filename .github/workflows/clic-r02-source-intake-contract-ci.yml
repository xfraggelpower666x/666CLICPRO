name: 666CLIC R02 create-only source contract CI
on:
  push:
    branches: [clic-migration-rev79-staging]
    paths:
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-source-intake-create-only.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-source-intake-create-only.test.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-native-approval-readback.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-native-approval-readback.test.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-one-time-host-contract.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/r02-one-time-host-contract.test.mjs'
      - '.github/workflows/clic-r02-source-intake-contract-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test CLIC-native create-only and StarBridge guards offline
        run: node --test 666CLIC_NATIVE_RUNTIME/continuity/r02-source-intake-create-only.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/r02-native-approval-readback.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/r02-one-time-host-contract.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/starbridge-evidence.test.mjs
# NEVER creates native receipt, dispatches to foreign systems or grants write authority.
