name: CLIC IVI08-A Connector Readback Gates
on:
  push:
    branches: [clic-migration-rev79-staging]
    paths:
      - '666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-github-connector.mjs'
      - '666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-github-connector.test.mjs'
      - '.github/workflows/clic-ivi08a-connector.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connector-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify connector and legacy regressions
        run: |
          node --check 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-github-connector.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-github-connector.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-adapter.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-v014.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/verified-visual-presenter.test.mjs
# Host-injected connector mock tests; real provider readbacks are independently checked at native runtime.
