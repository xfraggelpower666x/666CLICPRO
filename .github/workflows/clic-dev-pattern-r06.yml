name: CLIC R06 666DEV-derived Native PDI Advisory Regression
on:
  push:
    branches:
      - clic-migration-rev79-staging
    paths:
      - ".github/workflows/clic-dev-pattern-r06.yml"
      - "666CLIC_NATIVE_RUNTIME/facets/parallel_development_intelligence/dev-pattern-adaptation.mjs"
      - "666CLIC_NATIVE_RUNTIME/facets/parallel_development_intelligence/dev-pattern-adaptation.test.mjs"
      - "666CLIC_NATIVE_RUNTIME/outbox/666DEV/CLIC-TO-666DEV-R06-20261122-01.json"
      - "666CLIC_NATIVE_RUNTIME/CURRENT_POINTER.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-advisory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run isolated CLIC R06 native PDI advisory regressions
        run: node --test 666CLIC_NATIVE_RUNTIME/facets/parallel_development_intelligence/dev-pattern-adaptation.test.mjs
      - name: Verify pinned handoff scope and advisory guards
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const prefix='666CLIC_NATIVE_RUNTIME/';
          const path=prefix+'outbox/666DEV/CLIC-TO-666DEV-R06-20261122-01.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const head=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.match(head,/^[0-9a-f]{40}$/);
          assert.equal(data.source_system,'666CLIC');
          assert.equal(data.target,'666DEV');
          assert.equal(data.status,'PREPARED');
          assert.equal(data.delivery_status,'NOT_VERIFIED');
          assert.equal(data.native_adoption_verified,false);
          assert.equal(data.foreign_mutation,false);
          assert.equal(data.consumer,'NO_VERIFIED_AUTOMATIC_666DEV_CONSUMER');
          for(const relative of ['facets/parallel_development_intelligence/dev-pattern-adaptation.mjs','facets/parallel_development_intelligence/dev-pattern-adaptation.test.mjs']) {
            const full=prefix+relative;
            const blob=execFileSync('git',['rev-parse','HEAD:'+full],{encoding:'utf8'}).trim();
            const measured=execFileSync('git',['hash-object',full],{encoding:'utf8'}).trim();
            assert.equal(blob,measured);
          }
          console.log(JSON.stringify({status:'CLIC_R06_SOURCE_AND_HANDOFF_GUARDS_PASS',head,handoff_id:data.handoff_id,delivery_status:data.delivery_status}));
          NODE
