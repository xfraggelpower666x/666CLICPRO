name: 666CLIC StarBridge evidence regression
on:
  push:
    branches:
      - clic-migration-rev79-staging
    paths:
      - '666CLIC_NATIVE_RUNTIME/continuity/starbridge-evidence.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/starbridge-evidence.test.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/receiver-gates-negatives.test.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/STARBRIDGE_SB01_SB03_CHANNEL_INVENTORY_2026-10-16.md'
      - '.github/workflows/clic-starbridge-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  starbridge-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test StarBridge idempotency, provenance and work-anchor guards
        run: node --test 666CLIC_NATIVE_RUNTIME/continuity/starbridge-evidence.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/receiver-gates-negatives.test.mjs
# Offline logic checks only; no remote delivery, foreign writes or fresh-chat claims.
