name: CLIC GPT6 Interactive Visual v01.4
on:
  push:
    branches: [clic-migration-rev79-staging]
    paths:
      - '666CLIC_NATIVE_RUNTIME/dashboard/verified-visual-presenter.mjs'
      - '666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-v014.test.mjs'
      - '.github/workflows/clic-interactive-visual-v014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V01.4 evidence projection and legacy regression
        run: |
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-v014.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/verified-visual-presenter.test.mjs
# Source tests only, not live plugin host dispatch, renderer or external delivery.
