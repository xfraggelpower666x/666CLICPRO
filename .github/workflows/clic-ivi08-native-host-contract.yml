name: CLIC IVI08 GPT Native Host Contract
on:
  push:
    branches: [clic-migration-rev79-staging]
    paths:
      - '666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-presentation.mjs'
      - '666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-presentation.test.mjs'
      - '.github/workflows/clic-ivi08-native-host-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native UI presentation, connector and legacy regressions
        run: |
          node --check 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-presentation.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-presentation.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-gpt-native-binding.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-github-connector.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-host-adapter.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/interactive-visual-v014.test.mjs
          node --test 666CLIC_NATIVE_RUNTIME/dashboard/verified-visual-presenter.test.mjs
# This is source-contract CI, NOT real ChatGPT host execution.
