name: 666CLIC CLS Drive receipt evidence regression
on:
  push:
    branches:
      - clic-migration-rev79-staging
    paths:
      - '666CLIC_NATIVE_RUNTIME/continuity/starbridge-cls-drive-receipt.mjs'
      - '666CLIC_NATIVE_RUNTIME/continuity/starbridge-cls-drive-receipt.test.mjs'
      - '.github/workflows/clic-cls-drive-evidence-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cls-drive-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Drive receipt and anti-fake regression checks (mock connectors)
        run: node --test 666CLIC_NATIVE_RUNTIME/continuity/starbridge-cls-drive-receipt.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/starbridge-evidence.test.mjs 666CLIC_NATIVE_RUNTIME/continuity/starbridge-receipt-readback.test.mjs
# No network reads to CLS, no foreign writes and no actual delivery claims.
